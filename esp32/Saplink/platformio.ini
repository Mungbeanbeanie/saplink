; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:blink]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<blink_main.cpp>

[env:diagnostic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<diagnostic_main.cpp>

[env:soil]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<soil_main.cpp>
lib_deps = adafruit/Adafruit ADS1X15@^2.5.0

[env:probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<probe_main.cpp>
lib_deps = adafruit/Adafruit ADS1X15@^2.5.0

[env:pump]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<pump_main.cpp>

; env:sensor and env:actuator removed -- they pointed at src/sensor_main.cpp and
; src/actuator_main.cpp, neither of which exists, so both failed to build and a
; bare `pio run` failed with them. They are the dedicated-second-board stretch
; split; re-add them together with the files.

[env:combo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<combo_main.cpp>
lib_deps = adafruit/Adafruit ADS1X15@^2.5.0
; LDF compiles every .cpp in lib/saplink_common/, cloud_client.cpp included, and
; that one includes secrets.h from include/ -- which PlatformIO puts on the path
; for src/ but not for a library built as its own static lib. combo is the first
; Arduino env to pull in that library, so this break was latent until now.
build_flags = -I include

; The e-stop. src/relayoff_main.cpp has been in the tree since 929473b but this
; env never was, so the one sketch that can stop a running pump had no way to be
; built. Keep it committed -- "flash relayoff" is the documented recovery.
[env:relayoff]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<relayoff_main.cpp>

[env:native]
platform = native
; cloud_client.* needs Arduino/WiFi/secrets.h -- excluded, not testable off-device.
build_src_filter = -<*> +<../test/> +<../lib/saplink_common/> -<../lib/saplink_common/cloud_client.*>
