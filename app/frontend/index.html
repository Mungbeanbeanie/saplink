<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saplink — a Wi-Fi router for plants</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/organic.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Bitter + Karla: intro-loader-only typefaces (src/components/IntroLoader.jsx) -->
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Karla:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Google Identity Services for real sign-in (src/lib/auth.js) -->
    <!-- ponytail: deliberately NOT async. renderGoogleButton() has no retry and
         useSyncExternalStore's snapshot is `email`, so a late-arriving GIS flips
         auth.js's `ready` without notifying anyone -- an already-mounted button
         then stays empty until a manual reload. A blocking classic script runs
         before the deferred module entry, so window.google is always there.
         Upgrade path if the ~100ms ever matters: restore async and make the
         snapshot include readiness so the button re-renders. -->
    <script src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
